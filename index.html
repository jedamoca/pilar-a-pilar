<!doctype html>
<html lang="es">

  <meta name="application-name" content="Pilar a Pilar">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
  <header class="site-header">
    <a class="brand" href="#inicio" data-nav="welcome" aria-label="Pilar a Pilar, inicio">
      <img class="brand-mark" src="./favicon.svg" alt="" aria-hidden="true">
      <span>Pilar <strong>a Pilar</strong></span>
    </a>
    <button class="button button-secondary install-app-button" type="button" id="install-app-button" aria-label="Instalar Pilar a Pilar"><span aria-hidden="true">⇩</span><span class="install-button-label">Instalar</span></button>
    <nav class="main-nav" id="main-nav" aria-label="Navegación principal" hidden>

  <main id="main-content" class="app-main" tabindex="-1">
    <div class="loading-state" role="status">Preparando tu espacio personal…</div>

    <p class="privacy-note">Tus datos se guardan en este navegador y no se envían a un servidor.</p>
  </footer>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./js/app.js"></script>
